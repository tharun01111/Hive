services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - client
      - server
    networks:
      - hive-net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    environment:
      - VITE_API_URL=http://localhost/api
      - VITE_SOCKET_URL=http://localhost
    networks:
      - hive-net

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    env_file:
      - ./server/.env
    environment:
      - PORT=3000
      - NODE_ENV=development
    networks:
      - hive-net

volumes:
  server_node_modules:
  client_node_modules:

networks:
  hive-net:
    driver: bridge
